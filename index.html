<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sham Store — Menu</title>
  <style>
    /* ============================================================
       THEME — Sham sage-green (mirrors the Flutter kiosk app_theme)
       ============================================================ */
    :root {
      --bg:#F5F0E8; --surface:#FFFFFF; --ink:#2A2A2A; --muted:#6f6a5f;
      --primary:#4D6B47; --secondary:#3A5235; --accent:#8FAF7A; --sale:#D9534F;
      --line:#e5dfd1; --card-sh:rgba(60,60,40,.10);
      --wa:#25d366; --wa-dk:#1da851; --danger:#c0392b; --radius:16px; --header-h:62px;
    }
    :root[data-theme="dark"] {
      --bg:#1A2318; --surface:#243022; --ink:#D4E8CF; --muted:#9fb298;
      --primary:#8FAF7A; --secondary:#6B9460; --accent:#8FAF7A; --sale:#E06B67;
      --line:#33452f; --card-sh:rgba(0,0,0,.35); --danger:#e57368;
    }
    :root { --app-grad: linear-gradient(90deg, #152718 0%, #3A5235 55%, #4D6B47 100%); }

    * { box-sizing: border-box; }
    html, body {
      margin:0; padding:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
      transition: background .25s ease, color .25s ease;
    }

    /* ============ HEADER ============ */
    header { position: sticky; top: 0; z-index: 40; background: var(--app-grad); color:#fff; box-shadow: 0 3px 14px rgba(20,30,15,.28); }
    .header-inner { min-height:var(--header-h); padding:10px 14px; display:flex; align-items:center; gap:10px; }
    .brand { flex:none; display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none; -webkit-user-select:none; background:rgba(255,255,255,.94); border-radius:10px; padding:6px 11px; box-shadow:0 3px 8px rgba(0,0,0,.18); }
    .brand .logo { height:28px; width:auto; display:block; }
    .brand .wordmark { font-weight:800; color:var(--secondary); font-size:1.05rem; letter-spacing:.2px; }
    .brand .wordmark small { display:block; font-size:.58rem; font-weight:600; opacity:.7; letter-spacing:2px; }
    .icon-btn { flex:none; position:relative; background:rgba(255,255,255,.94); border:none; color:#fff; width:42px; height:42px; border-radius:17px; font-size:1.2rem; cursor:pointer; display:grid; place-items:center; transition:background .2s ease, transform .1s ease; }
    .icon-btn:hover { background:rgba(255,255,255,.28); } .icon-btn:active { transform:scale(.93); }
    .lang-btn { flex:none; background:rgba(255,255,255,.94); border:1px solid rgba(255,255,255,.4); color:#000000; height:42px; min-width:44px; padding:0 12px; border-radius:17px; font-weight:600; font-size:.95rem; cursor:pointer; }
    .lang-btn:hover { background:rgba(255,255,255,.28); }
    .badge { position:absolute; top:-5px; right:-5px; min-width:21px; height:21px; padding:0 6px; background:var(--sale); color:#fff; font-size:.72rem; font-weight:700; border-radius:999px; display:grid; place-items:center; border:2px solid #2f4a2a; transform:scale(0); transition:transform .18s cubic-bezier(.3,1.4,.5,1); }
    .badge.show { transform:scale(1); }
    @media (max-width:420px){ .brand .wordmark { display:none; } .brand { padding:6px 9px; } }

    /* ============ HEADER SEARCH — collapsible glass pill ============ */
    .search-box {
      position:relative;
      flex:0 0 44px; min-width:0; max-width:44px; margin:0 auto;
      display:flex; align-items:center; gap:9px; height:44px;
      padding:0 11px;
      background:rgba(255,255,255,.15);
      border:3px solid rgba(255,255,255,.4);
      border-radius:999px;
      overflow:hidden;
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      box-shadow:0 6px 16px rgba(0,0,0,.15);
      transition:flex-grow .45s cubic-bezier(.4,0,.2,1), flex-basis .45s cubic-bezier(.4,0,.2,1), max-width .45s cubic-bezier(.4,0,.2,1), background .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .search-box.open { flex:1 1 0; max-width:480px; }
    .search-box:focus-within { border-color:rgba(255,255,255,.7); box-shadow:0 0 0 4px rgba(143,175,122,.35), 0 6px 16px rgba(0,0,0,.15); }
    .search-icon { flex:none; display:flex; align-items:center; justify-content:center; background:none; border:none; padding:0; margin:0; color:rgba(255,255,255,.85); cursor:pointer; transition:color .2s ease; }
    .search-icon svg { width:19px; height:19px; }
    .search-box:focus-within .search-icon, .search-box.open .search-icon { color:#fff; }
    .search-box input { flex:1; min-width:0; width:0; background:none; border:none; outline:none; color:#fff; font-size:.95rem; font-weight:300; letter-spacing:.5px; font-family:inherit; opacity:0; transition:opacity .25s ease .1s; }
    .search-box.open input { width:auto; opacity:1; }
    .search-box input::placeholder { color:rgba(255,255,255,.75); font-weight:300; }

    /* ============ ADS / PROMO CAROUSEL ============ */
    .promo-track { direction:ltr; display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 16px 8px; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .promo-track.dragging { scroll-snap-type:none; scroll-behavior:auto; }
    .promo-track::-webkit-scrollbar { display:none; }
    .promo-card { scroll-snap-align:center; flex:0 0 78%; max-width:520px; height:200px; border-radius:18px; position:relative; overflow:hidden; cursor:pointer; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.18); background-size:cover; background-position:center; }
    @media (min-width:620px){ .promo-card { flex-basis:60%; } }
    @media (min-width:900px){ .promo-card { flex-basis:42%; } }
    .promo-card .overlay-grad { position:absolute; inset:0; background:linear-gradient(180deg, transparent 30%, rgba(0,0,0,.45) 100%); }
    .promo-card .p-body { position:absolute; inset:0; padding:16px; display:flex; flex-direction:column; }
    .promo-card .p-icon { align-self:flex-start; background:rgba(255,255,255,.22); border-radius:10px; padding:6px 8px; font-size:1.05rem; }
    .promo-card .p-title { margin-top:auto; font-size:1.25rem; font-weight:800; text-shadow:0 2px 5px rgba(0,0,0,.4); }
    .promo-card .p-sub { font-size:.82rem; opacity:.92; margin-top:2px; }
    .promo-card .p-pill { align-self:flex-start; margin-top:10px; background:#fff; border-radius:20px; padding:6px 14px; font-size:.78rem; font-weight:800; }
    body[data-lang="ar"] .promo-card .p-title, body[data-lang="ar"] .promo-card .p-sub { text-align:right; }
    body[data-lang="ar"] .promo-card .p-icon, body[data-lang="ar"] .promo-card .p-pill { align-self:flex-end; }

    /* ============ CATEGORY TAB BAR ============ */
    .tabbar { position:sticky; top:var(--header-h); z-index:30; display:flex; gap:2px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--line); padding:0 8px; scrollbar-width:none; }
    .tabbar::-webkit-scrollbar { display:none; }
    .tab { flex:none; background:none; border:none; padding:13px 14px; font-weight:700; font-size:.9rem; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; }
    .tab.active { color:var(--primary); border-bottom-color:var(--primary); }

    /* ============ MENU ============ */
    main { padding:6px 16px 120px; }
    .cat-section { display:none; margin-top:22px; scroll-margin-top:108px; }
    .cat-section.show { display:block; }
    .cat-title { font-size:1.15rem; margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid var(--line); color:var(--secondary); }
    :root[data-theme="dark"] .cat-title { color:var(--ink); }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(2,1fr); }
    @media (min-width:560px){ .grid { grid-template-columns:repeat(3,1fr); } }
    @media (min-width:900px){ .grid { grid-template-columns:repeat(4,1fr); } }
    .card { cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 2px 8px var(--card-sh); transition:transform .15s ease, box-shadow .2s ease; }
    .card:hover { transform:translateY(-3px); box-shadow:0 8px 22px var(--card-sh); }
    .thumb { aspect-ratio:1/1; display:grid; place-items:center; font-size:2.6rem; overflow:hidden; background:radial-gradient(120% 120% at 20% 10%, color-mix(in srgb, var(--accent) 35%, var(--surface)) 0%, var(--surface) 75%); color:var(--secondary); }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .card .body { padding:11px 12px 13px; display:flex; flex-direction:column; gap:5px; flex:1; }
    .card h3 { margin:0; font-size:.96rem; line-height:1.25; }
    .card .desc { margin:0; color:var(--muted); font-size:.8rem; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .card .row { display:flex; align-items:center; justify-content:space-between; margin-top:6px; gap:6px; }
    .price { font-weight:800; color:var(--primary); font-size:1rem; }
    .price-old { text-decoration:line-through; opacity:.6; font-weight:600; font-size:.85em; margin-inline-end:6px; }
    .price-sale { color:var(--sale); }
    .unit-label { font-size:.75em; font-weight:600; color:var(--muted); }
    .add-btn { background:var(--primary); color:#fff; border:none; width:34px; height:34px; border-radius:10px; font-weight:700; font-size:1.2rem; line-height:1; cursor:pointer; flex:none; transition:background .2s ease, transform .1s ease; }
    .add-btn:hover { background:var(--secondary); } .add-btn:active { transform:scale(.9); }
    .empty-menu { text-align:center; color:var(--muted); margin-top:60px; }

    /* ============ PROMO CONTROLS (swipe-only) ============ */
    .promo-wrap { position:relative; }
    .promo-track { cursor:grab; } .promo-track:active { cursor:grabbing; }

    /* ============ PRODUCT DETAIL PAGE ============ */
    .product-screen { position:fixed; inset:0; z-index:65; background:var(--bg); display:none; flex-direction:column; overflow-y:auto; }
    .product-screen.open { display:flex; }
    .ps-top { position:sticky; top:0; z-index:2; background:var(--app-grad); color:#fff; padding:10px 14px; display:flex; align-items:center; justify-content:space-between; box-shadow:0 3px 14px rgba(20,30,15,.28); }
    .ps-back { background:rgba(255,255,255,.15); border:none; color:#fff; width:42px; height:42px; border-radius:12px; font-size:1.4rem; line-height:1; cursor:pointer; }
    [dir="rtl"] .ps-back { transform:scaleX(-1); }
    .ps-body { max-width:760px; margin:0 auto; width:100%; padding-bottom:40px; }
    .ps-hero { width:100%; aspect-ratio:4/3; max-height:420px; display:grid; place-items:center; font-size:6rem; overflow:hidden; background:radial-gradient(120% 120% at 20% 10%, color-mix(in srgb, var(--accent) 35%, var(--surface)) 0%, var(--surface) 75%); color:var(--secondary); }
    .ps-hero img { width:100%; height:100%; object-fit:cover; }
    .ps-content { padding:20px 18px; }
    .ps-cat { display:inline-block; background:color-mix(in srgb, var(--accent) 25%, var(--surface)); color:var(--secondary); font-size:.78rem; font-weight:700; padding:4px 12px; border-radius:20px; margin-bottom:10px; }
    :root[data-theme="dark"] .ps-cat { color:var(--ink); }
    .ps-title { margin:0 0 6px; font-size:1.5rem; }
    .ps-price { font-size:1.4rem; font-weight:800; color:var(--primary); margin-bottom:14px; }
    .ps-desc { color:var(--ink); line-height:1.6; font-size:.98rem; white-space:pre-wrap; margin:0; }
    .ps-add { margin-top:24px; display:flex; gap:12px; align-items:center; }
    .ps-addbtn { flex:1; background:var(--primary); color:#fff; border:none; padding:16px; border-radius:12px; font-size:1rem; font-weight:800; cursor:pointer; }
    .ps-addbtn:active { transform:scale(.98); }
    .ps-stepper { flex:1; display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 10px; }
    .ps-stepper button { width:44px; height:44px; border:none; background:var(--primary); color:#fff; border-radius:10px; font-size:1.4rem; line-height:1; cursor:pointer; }
    .ps-stepper .ps-qtynum { font-size:1.2rem; font-weight:800; }
    .ps-checkout { background:var(--wa); color:#fff; border:none; padding:16px 18px; border-radius:12px; font-weight:800; cursor:pointer; display:flex; align-items:center; gap:8px; }
    .ps-rows { padding:6px 0 24px; }
    .ps-row { margin-top:18px; }
    .ps-row h3 { margin:0 0 10px; padding:0 18px; font-size:1.05rem; color:var(--secondary); }
    :root[data-theme="dark"] .ps-row h3 { color:var(--ink); }
    .ps-row-track { display:flex; gap:12px; overflow-x:auto; padding:0 18px 4px; scrollbar-width:none; }
    .ps-row-track::-webkit-scrollbar { display:none; }
    .mini-card { flex:0 0 140px; background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; text-align:start; padding:0; font-family:inherit; color:var(--ink); box-shadow:0 2px 8px var(--card-sh); }
    .mini-thumb { width:100%; aspect-ratio:1/1; display:grid; place-items:center; font-size:2.2rem; overflow:hidden; background:radial-gradient(120% 120% at 20% 10%, color-mix(in srgb, var(--accent) 35%, var(--surface)) 0%, var(--surface) 75%); color:var(--secondary); }
    .mini-thumb img { width:100%; height:100%; object-fit:cover; }
    .mini-name { font-weight:700; font-size:.85rem; padding:8px 10px 0; line-height:1.2; }
    .mini-price { font-weight:800; color:var(--primary); font-size:.85rem; padding:2px 10px 10px; }

    /* ============ CART PANEL ============ */
    .overlay { position:fixed; inset:0; background:rgba(20,25,15,.5); opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease; z-index:70; }
    .overlay.open { opacity:1; visibility:visible; }
    .cart-panel { position:fixed; top:0; right:0; height:100%; width:min(420px,100%); background:var(--bg); z-index:75; transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1); display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(20,25,15,.3); }
    [dir="rtl"] .cart-panel { right:auto; left:0; transform:translateX(-100%); box-shadow:8px 0 30px rgba(20,25,15,.3); }
    .cart-panel.open { transform:translateX(0); }
    .cart-head { padding:16px 18px; background:var(--app-grad); color:#fff; display:flex; align-items:center; justify-content:space-between; }
    .cart-head h2 { margin:0; font-size:1.15rem; }
    .close-btn { background:none; border:none; font-size:1.7rem; line-height:1; cursor:pointer; color:#fff; }
    .cart-items { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:12px; }
    .cart-empty { text-align:center; color:var(--muted); margin-top:40px; font-size:.95rem; }
    .cart-empty .big { font-size:2.5rem; display:block; margin-bottom:8px; }
    .cart-item { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; display:grid; grid-template-columns:44px 1fr auto; gap:12px; align-items:center; }
    .ci-thumb { width:44px; height:44px; border-radius:9px; display:grid; place-items:center; background:color-mix(in srgb, var(--accent) 30%, var(--surface)); font-size:1.4rem; overflow:hidden; }
    .ci-thumb img { width:100%; height:100%; object-fit:cover; }
    .ci-name { font-weight:700; font-size:.92rem; }
    .ci-unit { color:var(--muted); font-size:.8rem; }
    .ci-right { text-align:right; }
    [dir="rtl"] .ci-right { text-align:left; }
    .ci-total { font-weight:800; color:var(--primary); }
    .qty { display:inline-flex; align-items:center; gap:8px; margin-top:6px; }
    .qty button { width:26px; height:26px; border:1px solid var(--line); background:var(--surface); border-radius:7px; font-size:1rem; line-height:1; cursor:pointer; color:var(--primary); font-weight:700; }
    .qty button:active { transform:scale(.9); }
    .qty span { min-width:18px; text-align:center; font-weight:700; }
    .ci-remove { background:none; border:none; color:var(--danger); font-size:.78rem; cursor:pointer; margin-top:6px; padding:0; }
    .cart-foot { padding:16px 18px 22px; background:var(--surface); border-top:1px solid var(--line); }
    .total-row { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
    .total-row .label { color:var(--muted); font-weight:600; }
    .total-row .amount { font-size:1.5rem; font-weight:800; color:var(--primary); }
    .checkout-btn { width:100%; background:var(--wa); color:#fff; border:none; padding:15px; border-radius:12px; font-size:1.02rem; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .2s ease, transform .1s ease; }
    .checkout-btn:hover:not(:disabled){ background:var(--wa-dk); } .checkout-btn:active:not(:disabled){ transform:scale(.98); }
    .checkout-btn:disabled { opacity:.5; cursor:not-allowed; }

    /* ============ ADMIN ============ */
    .admin-screen { position:fixed; inset:0; z-index:80; background:var(--bg); display:none; flex-direction:column; }
    .admin-screen.open { display:flex; }
    .admin-top { background:var(--app-grad); color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .admin-top h2 { margin:0; font-size:1.15rem; }
    .admin-top .at-actions { display:flex; gap:8px; flex:none; }
    .admin-shell { display:flex; flex-direction:column; flex:1; min-height:0; }
    .admin-sidebar { display:flex; gap:4px; overflow-x:auto; background:var(--surface); border-bottom:1px solid var(--line); padding:8px 12px; flex:none; scrollbar-width:none; }
    .admin-sidebar::-webkit-scrollbar { display:none; }
    .admin-sidebar button { background:none; border:none; padding:10px 14px; border-radius:10px; font-size:.85rem; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; flex:none; }
    .admin-sidebar button:hover { background:color-mix(in srgb, var(--accent) 16%, var(--surface)); }
    .admin-sidebar button.active { color:#fff; background:var(--primary); }
    .admin-main { flex:1; overflow-y:auto; min-height:0; }
    .admin-body { padding:18px; max-width:900px; margin:0 auto; width:100%; }
    .stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:8px; }
    @media (min-width:560px){ .stat-grid { grid-template-columns:repeat(4,1fr); } }
    .stat-card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:6px; }
    .stat-card .stat-icon { font-size:1.4rem; }
    .stat-card .stat-num { font-size:1.6rem; font-weight:800; color:var(--primary); }
    .stat-card .stat-label { color:var(--muted); font-size:.82rem; font-weight:600; }
    @media (min-width:760px) {
      .admin-shell { flex-direction:row; }
      .admin-sidebar { flex-direction:column; align-items:stretch; width:220px; flex:none; border-bottom:none; border-inline-end:1px solid var(--line); padding:16px 12px; overflow-x:visible; overflow-y:auto; }
      .admin-sidebar button { justify-content:flex-start; }
    }
    .admin-pane { display:none; } .admin-pane.active { display:block; }
    .admin-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
    .admin-bar h3 { margin:0; font-size:1.05rem; }
    .btn { border:none; border-radius:10px; padding:10px 15px; font-weight:700; font-size:.9rem; cursor:pointer; }
    .btn-primary { background:var(--primary); color:#fff; } .btn-primary:hover { background:var(--secondary); }
    .btn-ghost { background:var(--surface); color:var(--primary); border:1px solid var(--line); } .btn-ghost:hover { background:color-mix(in srgb, var(--accent) 18%, var(--surface)); }
    .btn-danger { background:color-mix(in srgb, var(--danger) 14%, var(--surface)); color:var(--danger); } .btn-danger:hover { background:color-mix(in srgb, var(--danger) 24%, var(--surface)); }
    .btn-sm { padding:7px 11px; font-size:.82rem; }
    .list-row { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; display:flex; align-items:center; gap:12px; }
    .list-row .lr-thumb { width:42px; height:42px; border-radius:9px; display:grid; place-items:center; background:color-mix(in srgb, var(--accent) 30%, var(--surface)); font-size:1.3rem; overflow:hidden; flex:none; background-size:cover; background-position:center; }
    .list-row .lr-thumb img { width:100%; height:100%; object-fit:cover; }
    .list-row .lr-main { flex:1; min-width:0; }
    .list-row .lr-name { font-weight:700; }
    .list-row .lr-sub { color:var(--muted); font-size:.82rem; }
    .list-row .lr-actions { display:flex; gap:6px; flex:none; }
    .list-empty { color:var(--muted); text-align:center; padding:30px 0; }
    .form-modal { position:fixed; inset:0; z-index:90; background:rgba(20,25,15,.5); display:none; align-items:flex-end; justify-content:center; }
    .form-modal.open { display:flex; }
    @media (min-width:620px){ .form-modal { align-items:center; } }
    .form-card { background:var(--bg); width:min(560px,100%); max-height:92vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px; }
    @media (min-width:620px){ .form-card { border-radius:18px; } }
    .form-card h3 { margin:0 0 16px; }
    .field { margin-bottom:14px; }
    .field label { display:block; font-weight:600; font-size:.85rem; margin-bottom:6px; color:var(--ink); }
    .field input, .field textarea, .field select { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:.95rem; font-family:inherit; background:var(--surface); color:var(--ink); }
    .field textarea { min-height:64px; resize:vertical; }
    .field .hint { color:var(--muted); font-size:.75rem; margin-top:4px; }
    .field-2 { display:flex; gap:10px; } .field-2 > div { flex:1; }

    .img-preview img { width:100%; height:100%; object-fit:cover; }
    .img-editor-controls { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
    .img-editor-buttons { display:flex; gap:8px; flex-wrap:wrap; }
    .color-row { display:flex; gap:10px; } .color-row > div { flex:1; }
    .field input[type=color] { height:44px; padding:4px; }
    .check-field { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
    .check-field input { width:auto; }
    .check-field label { margin:0; }
    .form-actions { display:flex; gap:10px; margin-top:8px; }
    .form-actions .btn { flex:1; padding:13px; }
    .warn-note { background:color-mix(in srgb, var(--accent) 20%, var(--surface)); border:1px solid var(--line); color:var(--ink); border-radius:10px; padding:10px 12px; font-size:.8rem; margin-bottom:16px; }

    /* ============ LOGIN (replaces the old client-side PIN) ============ */
    .login-modal { position:fixed; inset:0; z-index:100; background:rgba(20,25,15,.55); display:none; align-items:center; justify-content:center; padding:20px; }
    .login-modal.open { display:flex; }
    .login-card { background:var(--bg); border-radius:18px; padding:24px; width:min(360px,100%); }
    .login-card h3 { margin:0 0 6px; text-align:center; }
    .login-card p { margin:0 0 16px; color:var(--muted); font-size:.85rem; text-align:center; }
    .login-card input { width:100%; font-size:1rem; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); margin-bottom:10px; }
    .login-error { color:var(--danger); font-size:.82rem; min-height:18px; margin:2px 0 8px; text-align:center; }

    /* ============ BOOT (loading / setup / error) ============ */
    .boot { position:fixed; inset:0; z-index:200; background:var(--bg); display:none; align-items:center; justify-content:center; padding:24px; }
    .boot.open { display:flex; }

    :root[data-theme="dark"] .boot-card h2 { color:var(--ink); }
    .boot-card p { color:var(--muted); line-height:1.6; margin:0 0 8px; }
    .boot-card code { background:color-mix(in srgb, var(--accent) 22%, var(--surface)); padding:2px 6px; border-radius:6px; font-size:.85rem; }
    .spinner { width:34px; height:34px; border:4px solid color-mix(in srgb, var(--primary) 30%, transparent); border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 14px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>

            <div id="adminProductList"></div>

          <div class="admin-pane" id="pane-categories">
            <div class="admin-bar"><h3>الفئات</h3><button class="btn btn-primary btn-sm" id="addCategoryBtn">+ إضافة فئة</button></div>
            <div id="adminCategoryList"></div>
          </div>
          <div class="admin-pane" id="pane-ads">
            <div class="admin-bar"><h3>لافتات الإعلانات</h3><button class="btn btn-primary btn-sm" id="addAdBtn">+ إضافة إعلان</button></div>

  <div class="boot" id="boot"><div class="boot-card" id="bootCard"></div></div>

  <!-- ============================ SCRIPT ============================ -->
  <script>
  /* ================================================================
     ⚠️  CONFIG
       SUPABASE_URL / SUPABASE_ANON_KEY — from your Supabase project
         (Project Settings → API). The anon key is public by design;
         database security policies restrict writes to signed-in admins.
       WHATSAPP_NUMBER — full international format, DIGITS ONLY (no + / spaces).
       Admin is opened by long-pressing the logo, then signing in with the
       admin email/password created in Supabase Authentication → Users.
     ================================================================ */
  const SUPABASE_URL      = "https://sngsxxvkfhbofprvxaio.supabase.co";  // your Project URL
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNuZ3N4eHZrZmhib2ZwcnZ4YWlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MjIwMTIsImV4cCI6MjEwMTE5ODAxMn0.EtvsuUGPB5hLXX9xSQkaWq7BSIvX_s__FTt1xEEh2aE";
  const WHATSAPP_NUMBER = "905528192778";
  const CURRENCY        = "₪";
  const THEME_KEY = "shamstore_theme", LANG_KEY = "shamstore_lang", TOKEN_KEY = "shamstore_admin_token";

  const isConfigured = () => /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes("YOUR-ANON");
  const UNIT_OPTIONS = ["كيلو", "نصف كيلو", "ربع كيلو", "جرام", "علبة", "حبة", "عبوة", "لتر", "مل"];

  /* ---------- UI strings ---------- */
  const I18N = {
    en: { viewOffer:"View Offer", yourOrder:"Your Order", checkoutWa:"Checkout via WhatsApp",
      checkout:"Checkout", view:"View", total:"Total", each:"each", remove:"Remove", other:"Other",
      emptyCart:"Your cart is empty.<br/>Add some items from the menu!", emptyMenu:"No products yet.",
      added:"Added to order", orderHi:"Hello, I would like to order:", orderTotal:"Total", langBtn:"ع", addToCart:"Add to cart", related:"Related products", favorites:"Favorites", mostViewed:"Most viewed",
      searchPlaceholder:"Search products…", searchResults:"Search results", noResults:"No products match your search.",
      items:(n)=>`${n} item${n===1?"":"s"}` },
    ar: { viewOffer:"عرض التفاصيل", yourOrder:"طلبك", checkoutWa:"أتمم الطلب عبر واتساب",
      checkout:"إتمام", view:"عرض", total:"الإجمالي", each:"للحبة", remove:"إزالة", other:"أخرى",
      emptyCart:"سلتك فارغة.<br/>أضف بعض المنتجات من القائمة!", emptyMenu:"لا توجد منتجات بعد.",
      added:"أُضيف إلى الطلب", orderHi:"مرحبًا، أودّ أن أطلب:", orderTotal:"الإجمالي", langBtn:"EN", addToCart:"أضف إلى الطلب", related:"منتجات ذات صلة", favorites:"المفضلة", mostViewed:"الأكثر مشاهدة",
      searchPlaceholder:"ابحث عن المنتجات…", searchResults:"نتائج البحث", noResults:"لا توجد منتجات مطابقة لبحثك.",
      items:(n)=>`${n} ${n===1?"منتج":"منتجات"}` },
  };

  /* ---------- State ---------- */
  let state = { categories: [], products: [], ads: [], settings: { showPrices: true, showBasket: true } };
  let lang = "ar";
  let accessToken = null;
  let searchQuery = "";
  const cart = {};
  let formUploadedPhoto = null, adUploadedPhoto = null, currentProductId = null;

  /* ---------- Utilities ---------- */
  const $ = (id) => document.getElementById(id);
  const money = (n) => CURRENCY + Number(n).toFixed(2);
  const pricesVisible = () => !!state.settings.showPrices;
  const basketVisible = () => !!state.settings.showBasket;
  function effectivePrice(p) {
    const sp = Number(p.salePrice);
    return (p.salePrice != null && !isNaN(sp) && sp > 0 && sp < Number(p.price)) ? sp : Number(p.price);
  }
  function unitSuffix(p) {
    return p.unit ? ` <span class="unit-label">/ ${esc(p.unit)}</span>` : "";
  }
  function priceHTML(p, opts) {
    const force = opts && opts.force;
    if (!force && !pricesVisible()) return "";
    const sp = Number(p.salePrice);
    const hasSale = p.salePrice != null && !isNaN(sp) && sp > 0 && sp < Number(p.price);
    const priceMarkup = hasSale
      ? `<span class="price-old">${money(p.price)}</span> <span class="price-sale">${money(sp)}</span>`
      : money(p.price);
    return priceMarkup + unitSuffix(p);
  }
  const esc = (s="") => String(s).replace(/[&<>"']/g, (c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const isImgUrl = (v) => /^(https?:|data:)/i.test(v || "");
  const t = (k) => I18N[lang][k];
  const pick = (en, ar) => lang === "ar" ? (ar || en || "") : (en || ar || "");
  const findProduct = (id) => state.products.find((p)=>p.id===id);
  const findCategory = (id) => state.categories.find((c)=>c.id===id);
  const findAd = (id) => state.ads.find((a)=>a.id===id);
  const catName = (id) => { const c = findCategory(id); return c ? pick(c.nameEn, c.nameAr) : t("other"); };
  const prodName = (p) => pick(p.titleEn, p.titleAr);
  function toast() {}

  /* ================================================================
     SUPABASE data layer (REST) + snake_case ↔ camelCase mapping
     ================================================================ */
  const rowToProduct = (r) => ({ id:r.id, titleEn:r.title_en||"", titleAr:r.title_ar||"", descEn:r.desc_en||"", descAr:r.desc_ar||"", price:Number(r.price)||0, salePrice:(r.sale_price!=null?Number(r.sale_price):null), unit:r.unit||"", img:r.img||"🛍️", categoryId:r.category_id||null, viewCount:r.view_count||0, isFavorite:!!r.is_favorite });
  const productToRow = (p) => ({ title_en:p.titleEn, title_ar:p.titleAr, desc_en:p.descEn, desc_ar:p.descAr, price:p.price, sale_price:(p.salePrice!=null?p.salePrice:null), unit:(p.unit||null), img:p.img, category_id:p.categoryId });
  const rowToCategory = (r) => ({ id:r.id, nameEn:r.name_en||"", nameAr:r.name_ar||"" });
  const categoryToRow = (c) => ({ name_en:c.nameEn, name_ar:c.nameAr });
  const rowToSettings = (r) => ({ showPrices:r.show_prices!==false, showBasket:r.show_basket!==false });
  const settingsToRow = (s) => ({ show_prices:!!s.showPrices, show_basket:!!s.showBasket });
  const rowToAd = (r) => ({ id:r.id, titleEn:r.title_en||"", titleAr:r.title_ar||"", subEn:r.sub_en||"", subAr:r.sub_ar||"", g1:r.g1||"#B71C1C", g2:r.g2||"#EF5350", img:r.img||null, linkType:r.link_type||"none", linkCategoryId:r.link_category_id||null, linkProductId:r.link_product_id||null, linkUrl:r.link_url||"", active:r.active!==false });
  const adToRow = (a) => ({ title_en:a.titleEn, title_ar:a.titleAr, sub_en:a.subEn, sub_ar:a.subAr, g1:a.g1, g2:a.g2, img:a.img, link_type:a.linkType, link_category_id:a.linkCategoryId, link_product_id:a.linkProductId, link_url:a.linkUrl, active:a.active });

  function sbHeaders(auth) {
    const h = { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" };
    h.Authorization = "Bearer " + ((auth && accessToken) ? accessToken : SUPABASE_ANON_KEY);
    return h;
  }
  async function sbSelect(table, query) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, { headers: sbHeaders(false) });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function sbWrite(method, table, id, row) {
    let url = `${SUPABASE_URL}/rest/v1/${table}`;
    if (id) url += `?id=eq.${id}`;
    const opts = { method, headers: { ...sbHeaders(true), Prefer: "return=representation" } };
    if (row) opts.body = JSON.stringify(row);
    const r = await fetch(url, opts);
    if (r.status === 401 || r.status === 403) { signOut(true); throw new Error("الرجاء تسجيل الدخول مجددًا."); }
    if (!r.ok) throw new Error(await r.text());
    return method === "DELETE" ? null : r.json();
  }
  const sbInsert = (table, row) => sbWrite("POST", table, null, row);
  const sbUpdate = (table, id, row) => sbWrite("PATCH", table, id, row);
  const sbDelete = (table, id) => sbWrite("DELETE", table, id, null);
  async function sbRpc(fn, args) {
    try { await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, { method:"POST", headers: sbHeaders(false), body: JSON.stringify(args) }); } catch (e) {}
  }
  async function sbUploadImage(blob) {
    if (!accessToken) throw new Error("سجّل الدخول أولاً");
    const path = `img_${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/product-images/${path}`, {
      method: "POST", headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + accessToken, "Content-Type": "image/jpeg", "x-upsert": "true" }, body: blob,
    });
    if (!r.ok) throw new Error(await r.text());
    return `${SUPABASE_URL}/storage/v1/object/public/product-images/${path}`;
  }
  async function loadAll() {
    const [cats, prods, ads] = await Promise.all([
      sbSelect("categories", "select=*&order=sort_order,created_at"),
      sbSelect("products", "select=*&order=sort_order,created_at"),
      sbSelect("ads", "select=*&order=sort_order,created_at"),
    ]);
    state.categories = cats.map(rowToCategory);
    state.products = prods.map(rowToProduct);
    state.ads = ads.map(rowToAd);
    try {
      const rows = await sbSelect("settings", "select=*&id=eq.1");
      if (rows && rows[0]) state.settings = rowToSettings(rows[0]);
    } catch (e) {}
  }
  const renderAll = () => { applyBasketVisibility(); renderPromos(); renderTabBar(); renderMenu(); renderCart(); if (currentProductId) renderProduct(currentProductId); };
  function applyBasketVisibility() {
    const show = basketVisible();
    if ($("cartBtn")) $("cartBtn").style.display = show ? "" : "none";
    if ($("psCart")) $("psCart").style.display = show ? "" : "none";
    if (!show) closeCart();
  }
  async function saveSettings() {
    await sbUpdate("settings", 1, settingsToRow(state.settings));
  }
  function updateSettingsFromCheckboxes() {
    state.settings.showPrices = $("setShowPrices").checked;
    state.settings.showBasket = $("setShowBasket").checked;
    saveSettings().catch((e)=>alert("فشل حفظ الإعدادات: " + e.message));
    renderAll();
  }
  async function reload() { await loadAll(); renderAll(); if ($("adminScreen").classList.contains("open")) renderAdmin(); }

  /* ---------- Auth ---------- */
  async function signIn(email, password) {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST", headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }),
    });
    if (!r.ok) throw new Error("البريد الإلكتروني أو كلمة المرور غير صحيحة.");
    const j = await r.json();
    accessToken = j.access_token;
    try { localStorage.setItem(TOKEN_KEY, accessToken); } catch (e) {}
  }
  function signOut(silent) {
    accessToken = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    closeAdmin();
    if (!silent) openLoginModal();
  }

  function thumbHTML(img, cls) {
    if (isImgUrl(img)) return `<div class="${cls}"><img src="${esc(img)}" alt="" /></div>`;
    return `<div class="${cls}">${esc(img || "🛍️")}</div>`;
  }

  /* ---------- Theme & Language ---------- */
  function applyTheme(mode) { document.documentElement.dataset.theme=mode; $("themeBtn").textContent = mode==="dark"?"☀️":"🌙"; try{localStorage.setItem(THEME_KEY,mode);}catch(e){} }
  function toggleTheme() { applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"); }

  function applyStaticI18n() {
    $("langBtn").textContent = t("langBtn");
    $("cartTitle").textContent = t("yourOrder");
    $("totalLabel").textContent = t("total");
    $("checkoutLabel").textContent = t("checkoutWa");
    $("searchInput").placeholder = t("searchPlaceholder");
  }
  function setLang(l) {
    lang = l;
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.lang = l;
    document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
    document.body.dataset.lang = l;
    applyStaticI18n();
    renderAll();
    if ($("adminScreen").classList.contains("open")) renderAdmin();
  }
  function toggleLang() { setLang(lang === "ar" ? "en" : "ar"); }

  /* ================================================================
     ADS / PROMO CAROUSEL (seamless loop, swipe/drag to control manually)
     ================================================================ */
  function adCardHTML(a) {
    const title = pick(a.titleEn, a.titleAr), sub = pick(a.subEn, a.subAr);
    const bg = a.img ? `background-image:url('${esc(a.img)}')` : `background-image:linear-gradient(135deg, ${esc(a.g1||"#4D6B47")}, ${esc(a.g2||"#3A5235")})`;
    const pillColor = a.img ? "#3A5235" : (a.g1 || "#3A5235");
    const linked = a.linkType && a.linkType !== "none";
    return `
      <div class="promo-card" data-ad="${esc(a.id)}" style="${bg}">
        <div class="overlay-grad"></div>
        <div class="p-body">
          <span class="p-icon">${linked ? "🔗" : "📣"}</span>
          <div class="p-title">${esc(title)}</div>
          ${sub ? `<div class="p-sub">${esc(sub)}</div>` : ""}
          <span class="p-pill" style="color:${esc(pillColor)}">${esc(t("viewOffer"))}</span>
        </div>
      </div>`;

  function renderPromos() {
    const ads = state.ads.filter((a)=>a.active !== false);
    const track = $("promoTrack");
    promoRealCount = ads.length;
    $("promoWrap").style.display = ads.length ? "" : "none";
    // Triple the ads (when >1) so the strip can loop seamlessly in both directions.
    const copies = ads.length > 1 ? 3 : 1;
    let html = "";
    for (let c = 0; c < copies; c++) html += ads.map(adCardHTML).join("");
    track.innerHTML = html;
    // start centered on the middle copy so there's a full set of ads on each side
    if (copies === 3 && track.children[0]) track.scrollLeft = ads.length * (track.children[0].offsetWidth + 12);
  }
  function onAdClick(id) {
    const a = findAd(id); if (!a) return;
    if (a.linkType === "category" && a.linkCategoryId && findCategory(a.linkCategoryId)) goToCategory(sectionId(a.linkCategoryId));
    else if (a.linkType === "product" && a.linkProductId && findProduct(a.linkProductId)) openProduct(a.linkProductId);
    else if (a.linkType === "url" && a.linkUrl) window.open(a.linkUrl, "_blank");
    else { const f = firstSectionId(); if (f) goToCategory(f); }
  }
  let promoRealCount = 0, promoPaused = false, promoResume, promoDragMoved = 0;
  function promoStepPx() { const t = $("promoTrack"); return t.children[0] ? t.children[0].offsetWidth + 12 : 1; }
  // Seamless loop: after a scroll settles, if we've drifted out of the middle copy,
  // instantly jump one full set back into it. Content is identical, so it's invisible.
  function recenterLoop() {
    const t = $("promoTrack"); if (promoRealCount <= 1) return;
    const step = promoStepPx(), n = promoRealCount, idx = Math.round(t.scrollLeft / step);
    if (idx < n) t.scrollLeft = (idx + n) * step;
    else if (idx >= 2 * n) t.scrollLeft = (idx - n) * step;
  }
  function promoStep() { if (promoPaused || promoRealCount <= 1) return; $("promoTrack").scrollBy({ left: promoStepPx(), behavior: "smooth" }); }
  function pausePromo(ms) { promoPaused = true; clearTimeout(promoResume); promoResume = setTimeout(() => promoPaused = false, ms); }
  function initPromoAutoSlide() {
    const track = $("promoTrack");
    setInterval(promoStep, 3000);
    // mouse drag-to-scroll (desktop); touch uses native scrolling
    let dragging = false, startX = 0, startScroll = 0;
    track.addEventListener("pointerdown", (e) => {
      pausePromo(4000); promoDragMoved = 0;
      if (e.pointerType === "mouse") {
        dragging = true; startX = e.clientX; startScroll = track.scrollLeft;
        track.classList.add("dragging"); // disables scroll-snap while dragging so scrollLeft actually moves
        e.preventDefault();
      }
    });
    window.addEventListener("pointermove", (e) => { if (!dragging) return; const dx = e.clientX - startX; promoDragMoved = Math.abs(dx); track.scrollLeft = startScroll - dx; });
    window.addEventListener("pointerup", () => {
      if (dragging) track.classList.remove("dragging");
      dragging = false; clearTimeout(promoResume); promoResume = setTimeout(() => promoPaused = false, 1500);
    });
    // on settle: re-center for the loop
    let scrollT;
    track.addEventListener("scroll", () => { clearTimeout(scrollT); scrollT = setTimeout(recenterLoop, 120); });
    // tap opens the ad link (suppressed right after a drag)
    track.addEventListener("click", (e) => { if (promoDragMoved > 6) { promoDragMoved = 0; return; } const c = e.target.closest("[data-ad]"); if (c) onAdClick(c.dataset.ad); });
  }

    $("f_unit").addEventListener("change", (e)=>{ $("f_unit_other").style.display = e.target.value==="__other__" ? "" : "none"; });
    $("f_cat_new_btn").addEventListener("click", ()=>{
      const panel = $("f_cat_new_fields");
      panel.hidden = !panel.hidden;
      if (!panel.hidden) setTimeout(()=>$("f_newcat_en").focus(),50);
    });
    openFormModal(); setTimeout(()=>$("f_titleEn").focus(),50);
  }
  function effectiveFormImg() { if (formUploadedPhoto) return formUploadedPhoto; return $("f_img").value.trim() || "🛍️"; }
  function updateFormImgPreview() {
    const v = effectiveFormImg();
    $("f_img_preview").innerHTML = isImgUrl(v) ? `<img src="${esc(v)}" alt="" />` : `<span>${esc(v)}</span>`;
    $("f_remove_photo").style.display = formUploadedPhoto ? "" : "none";
    $("f_upload_btn").textContent = formUploadedPhoto ? "📷 استبدال الصورة" : "📷 رفع صورة";
  }
  function setupImageEditor(prefix, getPhoto, setPhoto) {
    const preview = () => prefix==="f" ? updateFormImgPreview() : updateAdImgPreview();
    preview();
    if (prefix==="f") $("f_img").addEventListener("input", ()=>{ if (!getPhoto()) preview(); });
    $(prefix+"_upload_btn").addEventListener("click", ()=>$(prefix+"_img_file").click());
    $(prefix+"_remove_photo").addEventListener("click", ()=>{ setPhoto(null); preview(); });
    $(prefix+"_img_file").addEventListener("change", async (e)=>{
      const file=e.target.files[0]; e.target.value="";
      if (!file) return;
      if (!file.type.startsWith("image/")) { alert("الرجاء اختيار ملف صورة"); return; }
      if (file.size > 15*1024*1024) { alert("الصورة كبيرة جدًا (الحد الأقصى 15 ميغابايت)"); return; }
      const btn = $(prefix+"_upload_btn"); const label = btn.textContent; btn.textContent = "⏳ جارٍ الرفع…"; btn.disabled = true;
      try { const blob = await compressImage(file, 900, 0.72); const url = await sbUploadImage(blob); setPhoto(url); }
      catch (err) { alert("فشل الرفع: " + err.message); }
      finally { btn.disabled = false; btn.textContent = label; preview(); }
    });
  }
  function compressImage(file, maxDim, quality) {
    return new Promise((resolve, reject)=>{
      const reader=new FileReader(); reader.onerror=reject;
      reader.onload=()=>{ const img=new Image(); img.onerror=reject;
        img.onload=()=>{ let {width,height}=img;
          if (width>=height && width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; }
          else if (height>width && height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; }
          const canvas=document.createElement("canvas"); canvas.width=width; canvas.height=height;
          canvas.getContext("2d").drawImage(img,0,0,width,height);
          canvas.toBlob((b)=> b ? resolve(b) : reject(new Error("blob failed")), "image/jpeg", quality);
        }; img.src=reader.result; };
      reader.readAsDataURL(file);
    });
  }
  async function saveProduct(id) {
    const titleEn=$("f_titleEn").value.trim(), titleAr=$("f_titleAr").value.trim();
    const price=parseFloat($("f_price").value);
    if (!titleEn && !titleAr) { alert("أضف عنوانًا (إنجليزي أو عربي)"); return; }
    if (isNaN(price) || price<0) { alert("أدخل سعرًا صحيحًا"); return; }
    const salePriceRaw = $("f_saleprice").value.trim();
    let salePrice = null;
    if (salePriceRaw !== "") {
      salePrice = parseFloat(salePriceRaw);
      if (isNaN(salePrice) || salePrice <= 0) { alert("أدخل سعر تخفيض صحيحًا"); return; }
      if (salePrice >= price) { alert("سعر التخفيض يجب أن يكون أقل من السعر الأصلي"); return; }
      salePrice = Math.round(salePrice*100)/100;
    }
    const unitSel = $("f_unit").value;
    const unit = unitSel === "__other__" ? $("f_unit_other").value.trim() : unitSel;
    const newCatPanel = $("f_cat_new_fields");
    let categoryId = $("f_cat").value || null;
    if (newCatPanel && !newCatPanel.hidden) {
      const nameEn = $("f_newcat_en").value.trim(), nameAr = $("f_newcat_ar").value.trim();
      if (nameEn || nameAr) {
        try {
          const [row] = await sbInsert("categories", categoryToRow({ nameEn, nameAr }));
          const newCat = rowToCategory(row);
          state.categories.push(newCat);
          categoryId = newCat.id;
        } catch (e) { alert("فشل إنشاء التصنيف: " + e.message); return; }
      }
    }
    const row = productToRow({ titleEn, titleAr, descEn:$("f_descEn").value.trim(), descAr:$("f_descAr").value.trim(), price:Math.round(price*100)/100, salePrice, unit, categoryId, img:effectiveFormImg() });
    try { if (id) await sbUpdate("products", id, row); else await sbInsert("products", row); closeFormModal(); await reload(); }
    catch (e) { alert("فشل الحفظ: " + e.message); }
  }
  async function toggleFavorite(id) {
    const p=findProduct(id); if (!p) return;
    try { await sbUpdate("products", id, { is_favorite: !p.isFavorite }); await reload(); }
    catch (e) { alert("فشل التحديث: " + e.message); }
  }
  async function deleteProduct(id) {
    const p=findProduct(id); if (!p) return;

    try { await sbDelete("products", id); delete cart[id]; if (currentProductId===id) closeProduct(); await reload(); }
    catch (e) { alert("فشل الحذف: " + e.message); }
  }

      <div class="check-field"><input type="checkbox" id="fa_active" ${!editing || editing.active!==false?"checked":""} /><label for="fa_active">إظهار هذا الإعلان في السلايدر</label></div>
      <div class="form-actions"><button class="btn btn-ghost" data-form-cancel>إلغاء</button><button class="btn btn-primary" data-save-ad="${editing?esc(editing.id):""}">حفظ</button></div>`;
    setupImageEditor("fa", () => adUploadedPhoto, (v)=>adUploadedPhoto=v);
    $("fa_linkType").addEventListener("change", (e)=>{

  async function saveAd(id) {

    catch (e) { alert("فشل الحذف: " + e.message); }

  const openFormModal = () => $("formModal").classList.add("open");
  const closeFormModal = () => $("formModal").classList.remove("open");

  /* ================================================================
     BOOT / loading / setup screens
     ================================================================ */
  function showBoot(kind, detail) {
    const c = $("bootCard"); $("boot").classList.add("open");
    if (kind === "loading") c.innerHTML = `<div class="spinner"></div><p>جارٍ تحميل القائمة…</p>`;
    else if (kind === "setup") c.innerHTML = `<div class="b-logo">🌿</div><h2>القائمة غير متصلة بعد</h2><p>افتح <code>index.html</code> والصق قيم <code>SUPABASE_URL</code> و<code>SUPABASE_ANON_KEY</code> أعلى الكود.</p>`;
    else c.innerHTML = `<div class="b-logo">⚠️</div><h2>تعذّر تحميل القائمة</h2><p>${esc(detail||"")}</p><button class="btn btn-primary" onclick="location.reload()">إعادة المحاولة</button>`;
  }

  /* ================================================================
     EVENT WIRING
     ================================================================ */
  $("langBtn").addEventListener("click", toggleLang);
  $("themeBtn").addEventListener("click", toggleTheme);
  $("searchInput").addEventListener("input", (e)=>{
    searchQuery = e.target.value;
    renderTabBar(); renderMenu();
  });
  $("searchInput").addEventListener("focus", updateSearchExpand);
  $("searchInput").addEventListener("blur", updateSearchExpand);
  $("searchIconBtn").addEventListener("click", ()=>{
    const box = $("searchBox");
    if (box.classList.contains("open")) { $("searchInput").focus(); return; }
    searchForceOpen = true;
    box.classList.add("open");
    window.scrollTo({ top: tabbarTargetTop(), behavior:"smooth" });
    setTimeout(()=>{ searchForceOpen = false; $("searchInput").focus(); updateSearchExpand(); }, 700);
  });
  $("tabbar").addEventListener("click", (e)=>{ const tb=e.target.closest(".tab"); if (!tb) return; goToCategory(tb.dataset.target); });
  $("menuRoot").addEventListener("click", (e)=>{ const b=e.target.closest("[data-add]"); if (b) { addToCart(b.dataset.add); return; } const o=e.target.closest("[data-open]"); if (o) openProduct(o.dataset.open); });
  $("cartItems").addEventListener("click", (e)=>{ const inc=e.target.closest("[data-inc]"), dec=e.target.closest("[data-dec]"), rem=e.target.closest("[data-remove]"); if (inc) changeQty(inc.dataset.inc,+1); if (dec) changeQty(dec.dataset.dec,-1); if (rem) removeItem(rem.dataset.remove); });
  $("cartBtn").addEventListener("click", openCart);
  $("closeBtn").addEventListener("click", closeCart);
  $("overlay").addEventListener("click", closeCart);
  $("checkoutBtn").addEventListener("click", checkout);
  $("psBack").addEventListener("click", closeProduct);
  $("psCart").addEventListener("click", openCart);
  $("productBody").addEventListener("click", (e)=>{

  $("adminAdList").addEventListener("click", (e)=>{ const ed=e.target.closest("[data-edit-ad]"), dl=e.target.closest("[data-del-ad]"); if (ed) openAdForm(ed.dataset.editAd); if (dl) deleteAd(dl.dataset.delAd); });
  $("setShowPrices").addEventListener("change", updateSettingsFromCheckboxes);
  $("setShowBasket").addEventListener("change", updateSettingsFromCheckboxes);
  $("formCard").addEventListener("click", (e)=>{ if (e.target.closest("[data-form-cancel]")) { closeFormModal(); return; } const sp=e.target.closest("[data-save-product]"), sc=e.target.closest("[data-save-category]"), sa=e.target.closest("[data-save-ad]"); if (sp) saveProduct(sp.dataset.saveProduct||null); if (sc) saveCategory(sc.dataset.saveCategory||null); if (sa) saveAd(sa.dataset.saveAd||null); });

  // admin access: long-press logo → login (or straight to admin if already signed in)
  let pressTimer;
  const brand = $("brand");
  brand.addEventListener("pointerdown", ()=>{ pressTimer = setTimeout(()=>{ if (accessToken) openAdmin(); else openLoginModal(); }, 1000); });
  brand.addEventListener("pointerup", ()=>clearTimeout(pressTimer));
  brand.addEventListener("pointerleave", ()=>clearTimeout(pressTimer));
  function openLoginModal() { $("loginEmail").value=""; $("loginPassword").value=""; $("loginError").textContent=""; $("loginModal").classList.add("open"); setTimeout(()=>$("loginEmail").focus(), 50); }
  const closeLoginModal = () => $("loginModal").classList.remove("open");
  async function submitLogin() {
    const email=$("loginEmail").value.trim(), password=$("loginPassword").value;
    if (!email || !password) { $("loginError").textContent = "أدخل البريد الإلكتروني وكلمة المرور"; return; }
    $("loginSubmit").disabled = true; $("loginError").textContent = "";
    try { await signIn(email, password); closeLoginModal(); openAdmin(); }
    catch (e) { $("loginError").textContent = e.message; }
    finally { $("loginSubmit").disabled = false; }
  }
  $("loginSubmit").addEventListener("click", submitLogin);
  $("loginCancel").addEventListener("click", closeLoginModal);
  $("loginPassword").addEventListener("keydown", (e)=>{ if (e.key==="Enter") submitLogin(); });
  document.addEventListener("keydown", (e)=>{ if (e.key!=="Escape") return; if ($("loginModal").classList.contains("open")) return closeLoginModal(); if ($("formModal").classList.contains("open")) return closeFormModal(); if ($("adminScreen").classList.contains("open")) return closeAdmin(); if ($("cartPanel").classList.contains("open")) return closeCart(); });

  /* ---------- Init ---------- */
  async function boot() {
    applyTheme((()=>{ try { return localStorage.getItem(THEME_KEY)||"light"; } catch (e) { return "light"; } })());
    try { accessToken = localStorage.getItem(TOKEN_KEY) || null; } catch (e) {}
    initPromoAutoSlide();
    setLang((()=>{ try { return localStorage.getItem(LANG_KEY)||"ar"; } catch (e) { return "ar"; } })());
    updateSearchExpand();
    if (!isConfigured()) { showBoot("setup"); return; }
    showBoot("loading");
    try { await loadAll(); hideBoot(); renderAll(); handleHash(); }
    catch (e) { showBoot("error", (e && e.message) || "خطأ في الشبكة"); }
  }
  boot();
  </script>
